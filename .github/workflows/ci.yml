name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '>=1.25.0'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Build
      run: go build

    - name: Test
      run: go test ./...
